[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirivue-gtk4"
dynamic = ["version"]
description = "Gestionnaire de fichiers et de médias pour GNOME (GTK4, libadwaita)"
requires-python = ">=3.11"
dependencies = ["PyGObject>=3.46", "Pillow", "mutagen"]

[project.scripts]
mirivue-gnome = "mirivue_gtk4.launcher:main"

[project.urls]
Homepage = "https://github.com/denamiel/Mirivue-gnome"
Issues = "https://github.com/denamiel/Mirivue-gnome/issues"

[tool.setuptools.dynamic]
version = {attr = "mirivue_gtk4.__version__"}

[tool.setuptools.packages.find]
include = ["mirivue_gtk4*"]

[tool.setuptools.package-data]
mirivue_gtk4 = ["en.json", "help.fr.txt", "help.en.txt"]

[tool.setuptools.data-files]
"share/applications" = ["org.pdenams.Mirivue.Gtk4.desktop"]
"share/icons/hicolor/scalable/apps" = ["icons/hicolor/scalable/apps/org.pdenams.Mirivue.Gtk4.svg"]
"share/icons/hicolor/256x256/apps" = ["icons/hicolor/256x256/apps/org.pdenams.Mirivue.Gtk4.png"]
"share/mirivue-gnome" = ["packaging/transition_user_install.py"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = ["F"]
