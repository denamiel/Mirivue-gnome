name: Intégrité des transferts GIO sur le candidat
on:
  push:
    branches: [codex/qualification-gio-gnome]
    paths: [.github/workflows/qualification-gio.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  network:
    name: Coupures ${{ matrix.protocol }} dans un réseau isolé
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        protocol: [smb, sftp]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a3c77e22e2ed3b2187dfc6a1bcdc0af8a0c564eb
          persist-credentials: false
      - name: Construire et qualifier le paquet
        env:
          PROTOCOL: ${{ matrix.protocol }}
        run: |
          docker run --rm -i --cap-add=NET_ADMIN -e PROTOCOL -v "$PWD:/input:ro" debian:13 bash -euo pipefail -s <<'TEST'
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl build-essential devscripts equivs sudo dbus-x11 xvfb xauth samba openssh-server iptables iproute2
          mkdir -p /build
          cp -a /input/. /build/source
          cd /build/source
          mk-build-deps --install --remove --tool 'apt-get -y --no-install-recommends' debian/control
          dpkg-buildpackage --build=binary --no-sign
          apt-get install -y --no-install-recommends /build/mirivue-gnome_*.deb gvfs gvfs-backends
          test "$(mirivue-gnome --version)" = 1.0.6-rc.1
          cp debian/check-linux-integrations.py /tmp/check_linux_integrations.py
          useradd --create-home --shell /bin/bash validation
          printf '%s\n' 'validation ALL=(root) NOPASSWD: /usr/sbin/iptables' > /etc/sudoers.d/validation
          chmod 0440 /etc/sudoers.d/validation
          install -o validation -g validation -d /tmp/validation-smb /home/validation/validation-ssh
          if [[ "$PROTOCOL" = smb ]]; then
            cat > /etc/samba/smb.conf <<'SMB'
          [global]
          interfaces = lo
          bind interfaces only = yes
          map to guest = Bad User
          [mirivue]
          force user = validation
          path = /tmp/validation-smb
          guest ok = yes
          read only = no
          SMB
            smbd --daemon
          else
            install -d -m 0755 /run/sshd
            runuser -u validation -- mkdir -m 0700 /home/validation/.ssh
            runuser -u validation -- ssh-keygen -q -t ed25519 -N '' -f /home/validation/.ssh/id_ed25519
            runuser -u validation -- cp /home/validation/.ssh/id_ed25519.pub /home/validation/.ssh/authorized_keys
            /usr/sbin/sshd -o ListenAddress=127.0.0.1 -o UsePAM=yes
            runuser -u validation -- ssh -n -o BatchMode=yes -o StrictHostKeyChecking=accept-new validation@127.0.0.1 true
          fi
          tc qdisc replace dev lo root tbf rate 120mbit burst 128kb latency 100ms
          sed -i 's/Le transfert interrompu n’a pas signalé d’erreur./Aucun échec après la coupure. Coupure déclenchée : {disconnected}/; s/raise AssertionError("Aucun échec/raise AssertionError(f"Aucun échec/' /tmp/check_linux_integrations.py
          cd /tmp
          timeout --kill-after=8 250 runuser -u validation -- \
            xvfb-run -a dbus-run-session -- /usr/bin/python3 -u - "$PROTOCOL" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "/tmp")
          from check_linux_integrations import Gnome
          protocol = sys.argv[1]
          if protocol == "smb":
              url = "smb://127.0.0.1/mirivue/"
              directory = Path("/tmp/validation-smb")
          else:
              directory = Path.home() / "validation-ssh"
              url = f"sftp://validation@127.0.0.1{directory}/"
          print(f"Début de la qualification {protocol}", flush=True)
          backend = Gnome()
          backend.qualify_network(url, directory)

          import hashlib
          import os
          import subprocess
          import tempfile
          import time
          from mirivue_gtk4.core import gio_backend

          def digest(path):
              with path.open("rb") as data:
                  return hashlib.file_digest(data, "sha256").hexdigest()

          port = "445" if protocol == "smb" else "22"
          rule = ["OUTPUT", "-o", "lo", "-p", "tcp", "--dport", port,
                  "-j", "REJECT", "--reject-with", "tcp-reset"]
          with tempfile.TemporaryDirectory() as folder:
              local = Path(folder) / "sortant.bin"
              local.write_bytes(os.urandom(48 * 1024 * 1024))
              original = digest(local)
              source = backend.gio.File.new_for_path(str(local))
              destination = directory / local.name
              for move in (False, True):
                  for fraction in (0.01, 0.50):
                      destination.write_bytes(b"ancienne version sur le serveur")
                      previous = digest(destination)
                      for attempt in range(40):
                          try:
                              remote = backend.mount_share(url).get_child(local.name)
                              remote.query_info("standard::size", backend.gio.FileQueryInfoFlags.NONE, None)
                              break
                          except backend.glib.Error as error:
                              if attempt == 39 or not error.matches(
                                  backend.gio.io_error_quark(), backend.gio.IOErrorEnum.NOT_MOUNTED
                              ):
                                  raise
                              time.sleep(0.1)
                      interrupted = []
                      def cut(done, total):
                          if not interrupted and 0 < done < total and done / total >= fraction:
                              subprocess.run(["sudo", "-n", "iptables", "-I", *rule], check=True, timeout=10)
                              interrupted.append(True)
                      try:
                          gio_backend.replace(source, remote, move=move, progress=cut)
                      except (backend.glib.Error, OSError):
                          if not interrupted:
                              raise
                      else:
                          raise AssertionError("L'envoi interrompu n'a pas signalé d'erreur.")
                      finally:
                          if interrupted:
                              subprocess.run(["sudo", "-n", "iptables", "-D", *rule], check=True, timeout=10)
                      assert digest(local) == original
                      assert digest(destination) == previous
                      print(f"{protocol} : envoi avec remplacement, déplacement={move}, coupure à {fraction:.0%} — intégrité vérifiée")
              remote = backend.mount_share(url).get_child(local.name)
              gio_backend.replace(source, remote)
              assert digest(destination) == original
              assert digest(local) == original
              print(f"{protocol} : remplacement sortant abouti — intégrité vérifiée")
          PY
          TEST
