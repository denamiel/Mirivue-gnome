name: Mise à niveau de Mirivue GNOME depuis la version candidate
on:
  push:
    branches: [codex/mirivue-gnome-1-0-6-stable]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: 'ubuntu:24.04'
            manager: apt
          - system: 'ubuntu:26.04'
            manager: apt
          - system: 'debian:13'
            manager: apt
          - system: 'fedora:44'
            manager: dnf
          - system: 'fedora:45'
            manager: dnf
          - system: 'archlinux:base-devel'
            manager: pacman
    name: Mise à niveau (${{ matrix.system }})
    container: ${{ matrix.system }}
    env:
      MANAGER: ${{ matrix.manager }}
      SYSTEM: ${{ matrix.system }}
      DEBIAN_FRONTEND: noninteractive
      GSK_RENDERER: cairo
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Préparer les outils et construire le candidat
        shell: bash
        run: |
          case "$MANAGER" in
            apt)
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates curl build-essential devscripts equivs xvfb xauth dbus-x11 fonts-dejavu-core
              mk-build-deps --install --remove --tool 'apt-get -y --no-install-recommends' debian/control
              dpkg-buildpackage --build=binary --no-sign
              ;;
            dnf)
              dnf -y install curl git rpm-build python3 dnf5-plugins
              dnf -y builddep packaging/fedora/mirivue-gnome.spec
              python3 packaging/make_source.py --output packaging/fedora --no-aur
              rpmbuild -bb --define "_sourcedir $PWD/packaging/fedora" --define "_rpmdir $PWD/dist/rpms" packaging/fedora/mirivue-gnome.spec
              ;;
            pacman)
              pacman -Syu --noconfirm git python python-build python-installer python-setuptools python-wheel python-gobject python-cairo python-pillow python-mutagen gtk4 libadwaita gnome-desktop-4 poppler-glib hicolor-icon-theme gvfs ffmpeg mediainfo gst-plugins-good xorg-server-xvfb xorg-xauth dbus desktop-file-utils ttf-dejavu
              useradd --create-home builder
              python3 packaging/make_source.py
              cp dist/mirivue-gnome-*.tar.gz dist/aur/
              chown -R builder:builder "$GITHUB_WORKSPACE"
              runuser -u builder -- bash -c 'cd "$1/dist/aur"; makepkg --noconfirm --cleanbuild' -- "$GITHUB_WORKSPACE"
              ;;
          esac
      - name: Installer la RC publiée et passer à la version stable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tmp=$(mktemp -d)
          cd "$tmp"
          curl --fail --show-error --silent --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/v1.0.6-rc.1" -o release.json
          read -r archive digest download < <(python3 - <<'PY'
          import json
          import os

          data = json.load(open('release.json'))
          assert data['tag_name'] == 'v1.0.6-rc.1' and data['prerelease'] and not data['draft']
          suffixes = {
              'apt': '_all.deb',
              'dnf': '.fc' + os.environ['SYSTEM'].split(':')[1] + '.noarch.rpm',
              'pacman': '-any.pkg.tar.zst',
          }
          asset, = [entry for entry in data['assets']
                    if entry['name'].startswith('mirivue-gnome') and entry['name'].endswith(suffixes[os.environ['MANAGER']])]
          algorithm, digest = asset['digest'].split(':', 1)
          assert algorithm == 'sha256'
          print(asset['name'], digest, asset['browser_download_url'])
          PY
          )
          curl --fail --show-error --silent --location --retry 3 -o "$archive" "$download"
          printf '%s  %s\n' "$digest" "$archive" | sha256sum --check
          mkdir "$tmp/profile"
          export HOME="$tmp/profile" XDG_STATE_HOME="$tmp/profile/state" XDG_CONFIG_HOME="$tmp/profile/config" XDG_DATA_HOME="$tmp/profile/data" XDG_CACHE_HOME="$tmp/profile/cache"
          case "$MANAGER" in
            apt) apt-get install -y "./$archive" ;;
            dnf) dnf -y install "./$archive" ;;
            pacman) pacman -U --noconfirm "./$archive" ;;
          esac
          test "$(mirivue-gnome --version)" = 1.0.6-rc.1
          timeout 30 xvfb-run -a dbus-run-session -- /usr/bin/python3 "$GITHUB_WORKSPACE/packaging/qualify-profile.py" prepare 1.0.6-rc.1
          case "$MANAGER" in
            apt)
              dpkg --compare-versions '1.0.6~rc.1-1' lt '1.0.6-1'
              apt-get install -y "$GITHUB_WORKSPACE"/../mirivue-gnome_1.0.6-1_all.deb
              ;;
            dnf)
              dnf -y upgrade "$GITHUB_WORKSPACE"/dist/rpms/noarch/*.rpm
              ;;
            pacman)
              test "$(vercmp 1.0.6rc1-1 1.0.6-1)" = -1
              pacman -U --noconfirm "$GITHUB_WORKSPACE"/dist/aur/*.pkg.tar.zst
              ;;
          esac
          test "$(mirivue-gnome --version)" = 1.0.6
          timeout 30 xvfb-run -a dbus-run-session -- /usr/bin/python3 "$GITHUB_WORKSPACE/packaging/qualify-profile.py" verify 1.0.6
