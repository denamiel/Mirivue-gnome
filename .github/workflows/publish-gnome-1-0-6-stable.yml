name: Publier Mirivue GNOME 1.0.6 stable
on:
  push:
    branches: [codex/publication-gnome-1-0-6-stable]
    paths: [.github/workflows/publish-gnome-1-0-6-stable.yml]
permissions:
  contents: read
  actions: read
env:
  SOURCE_COMMIT: 3f6f8273a1b3fbd26c04523cd0ba384225cad631
  RELEASE_TAG: v1.0.6
  QUALIFIED_COMMIT: 0a35eae76c3ac9da9ed5d43428d8fe78256cdfd4
jobs:
  release:
    name: Publier les paquets testés
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - name: Vérifier les validations et récupérer les paquets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" = "$SOURCE_COMMIT"
          python3 packaging/check_release.py --require-license --tag "$RELEASE_TAG"
          git_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$QUALIFIED_COMMIT" --jq '.tree.sha')
          test "$(git rev-parse 'HEAD^{tree}')" = "$git_tree"
          for run in 45675669025 45675669032 45675669197 45675653870; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" |
              jq -e --arg sha "$QUALIFIED_COMMIT" '.head_sha == $sha and .conclusion == "success"' > /dev/null
          done
          gh run download 45675669025 --name rpm-fedora-44 --name rpm-fedora-45 --name arch-package --dir dist/validated
          gh run download 45675669032 --name mirivue-gnome-deb --dir dist/deb
          (cd dist/deb && sha256sum --check SHA256SUMS)
          test "$(dpkg-deb -f dist/deb/mirivue-gnome_1.0.6-1_all.deb Version)" = '1.0.6-1'
          python3 packaging/make_source.py --no-aur
      - name: Créer la version stable sur GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' packages < <(find dist/validated -type f \( -name '*.rpm' -o -name '*.pkg.tar.zst' \) -print0)
          test "${#packages[@]}" -ge 3
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Mirivue GNOME 1.0.6, édition GTK4/libadwaita.
          
          - Corrige le plantage à la fermeture du renommage F2 sous GNOME Wayland.
          - Préserve l’ancien fichier si la copie d’un remplacement par GIO est interrompue.
          - La mise à niveau depuis les paquets de la RC a préservé les réglages, les favoris et les onglets.
          - Le paquet `.deb` commun a été testé sous Debian 13, Ubuntu 24.04 et Ubuntu 26.04, y compris en session GNOME Wayland.
          - Les RPM Fedora 44/45 et le paquet Arch/CachyOS sont les artefacts des validations GitHub Actions.
          
          Pour installer le paquet Debian/Ubuntu téléchargé :
          
          ```bash
          sudo apt install ./mirivue-gnome_1.0.6-1_all.deb
          ```
          
          Sur Fedora et Arch/CachyOS, privilégier les dépôts COPR et Pacman configurés sur le système.
          NOTES
          gh release create "$RELEASE_TAG" --latest \
            --target "$SOURCE_COMMIT" --title 'Mirivue GNOME 1.0.6' \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            dist/deb/*.deb dist/deb/SHA256SUMS dist/mirivue-gnome-*.tar.gz dist/*.sha256 "${packages[@]}"
          gh release view "$RELEASE_TAG" --json url,assets

  copr:
    name: Vérifier la publication dans COPR
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Attendre les RPM publics pour Fedora 44 et 45
        run: |
          python3 - <<'PY'
          import json
          import time
          from urllib.request import urlopen

          base = "https://copr.fedorainfracloud.org/api_3/"
          expected = "1.0.6-1"
          targets = {"fedora-44-x86_64", "fedora-45-x86_64"}

          def get(path):
              with urlopen(base + path, timeout=20) as response:
                  return json.load(response)["items"]

          for attempt in range(36):
              builds = get("build/list/?ownername=pdenams&projectname=mirivue-gnome&limit=10")
              matching = [b for b in builds if (b.get("source_package") or {}).get("version") == expected]
              if matching:
                  build = max(matching, key=lambda b: b["id"])
                  states = {b["name"]: b["state"] for b in get(f"build-chroot/list/?build_id={build['id']}")}
                  print(build["id"], expected, states, flush=True)
                  if all(states.get(name) == "succeeded" for name in targets):
                      break
                  if any(states.get(name) in {"failed", "canceled"} for name in targets):
                      raise SystemExit("La construction COPR a échoué.")
              elif attempt == 0:
                  print("Construction COPR attendue.", flush=True)
              time.sleep(30)
          else:
              raise SystemExit("Les RPM publics n’ont pas été confirmés dans le délai.")
          PY
