name: Qualification GNOME Wayland avant stabilisation
on:
  push:
    branches: [codex/mirivue-gnome-1-0-6-rc]
    paths:
      - '.github/workflows/qualification-gnome.yml'
      - 'debian/**'
      - 'tests/**'
      - 'mirivue_gtk4/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Construire le paquet commun
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: debian:13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Construire le paquet et calculer sa somme SHA-256
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential devscripts equivs ca-certificates
          mk-build-deps --install --remove --tool 'apt-get -y --no-install-recommends' debian/control
          dpkg-buildpackage --build=binary --no-sign
          package="../mirivue-gnome_$(dpkg-parsechangelog -S Version)_all.deb"
          test "$(dpkg-deb -f "$package" Package)" = mirivue-gnome
          test "$(dpkg-deb -f "$package" Architecture)" = all
          mkdir -p dist/deb
          cp "$package" dist/deb/
          cd dist/deb
          sha256sum "${package##*/}" > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: mirivue-gnome-deb
          path: dist/deb/
          if-no-files-found: error

  wayland:
    needs: build
    name: "${{ matrix.system }} — série ${{ matrix.shard }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {system: ubuntu-26.04, shard: 1}
          - {system: ubuntu-26.04, shard: 2}
          - {system: ubuntu-26.04, shard: 3}
          - {system: ubuntu-24.04, shard: 1}
          - {system: debian-13, shard: 1}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mirivue-gnome-deb
          path: dist/deb
      - name: Préparer l’environnement QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 cloud-image-utils imagemagick acl ntfs-3g
          if test -c /dev/kvm; then sudo setfacl -m "u:$(id -un):rw" /dev/kvm; fi
      - name: Répéter la suite GTK sur le bureau Wayland
        env:
          VALIDATION_SYSTEM: ${{ matrix.system }}
        run: bash debian/verify-desktop-vm.sh "$VALIDATION_SYSTEM" gnome dist/deb 20
      - name: Conserver les journaux et les piles de plantage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-${{ matrix.system }}-${{ matrix.shard }}
          path: validation-vm/
          if-no-files-found: ignore
